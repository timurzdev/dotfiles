# set-option -sa terminal-overrides ",xterm*:Tc"
# set -g mouse on
#
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix
#
# # Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R
#
# Start windows and panes at 1, not 0
set-option -g default-shell /bin/zsh
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 50000
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g alternate-screen on
setw -g alternate-screen on
#
# # Use Alt-arrow keys without prefix key to switch panes
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D
#
# # Shift arrow to switch windows
# bind -n S-Left  previous-window
# bind -n S-Right next-window
#
# # Shift Alt vim keys to switch windows
# bind -n M-H previous-window
# bind -n M-L next-window
#
set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
# # set vi-mode
set-window-option -g mode-keys vi
# # keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c neww -c "#{pane_current_path}"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

# Transparent theme overrides: keep after TPM. Requires tmux with bg=terminal.
set -g window-style 'fg=terminal,bg=terminal'
set -g window-active-style 'fg=terminal,bg=terminal'

# Replace Catppuccin's solid status segments with plain text.
set -g status-style 'fg=terminal,bg=terminal'
set -g status-left ''
set -g status-right ' #W | #S '
setw -g window-status-style 'fg=terminal,bg=terminal'
setw -g window-status-current-style 'fg=#cba6f7,bg=terminal,bold'
setw -g window-status-activity-style 'fg=#f5c2e7,bg=terminal'
setw -g window-status-bell-style 'fg=#f38ba8,bg=terminal,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Borders, messages and copy-mode selection without background fills.
set -g pane-border-style 'fg=#6c7086,bg=terminal'
set -g pane-active-border-style 'fg=#cba6f7,bg=terminal'
set -g message-style 'fg=terminal,bg=terminal'
set -g message-command-style 'fg=terminal,bg=terminal'
setw -g mode-style 'fg=#cba6f7,bg=terminal,bold'
